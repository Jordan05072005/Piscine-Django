<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Copy</title>

    <style>
        p[data-value] {
            width: attr(data-value %);

        }
        progress[value]::-webkit-progress-value {
            animation: none;
        }
    </style>
</head>
<body>
<div>
    <ol>
        <li>
            <h2>Frontend</h2>
            <span class="progress-bar"></span>
            <p data-value="80">HTML5</p>
            <progress class="html5" value="80" max="100" ></progress>

            <span class="progress-bar"></span>
            <p data-value="60">CSS3</p>
            <progress class="html5" value="60" max="100" ></progress>

            <span class="progress-bar"></span>
            <p data-value="50">jQuery</p>
            <progress class="html5" value=50" max="100" ></progress>
        </li>
        <li>
            <h2>Backend</h2>
            <p data-value="75">Python</p>
            <span class="progress-bar">
                <progress class="python" value="75" max="100" ></progress>
            </span>

            <span class="progress-bar"></span>
            <p data-value="65">PHP</p>
            <progress class="python" value="65" max="100" ></progress>

            <span class="progress-bar"></span>
            <p data-value="35">Node.js</p>
            <progress class="python" value="35" max="100" ></progress>
        </li>
    </ol>

</div>

</body>
</html>
