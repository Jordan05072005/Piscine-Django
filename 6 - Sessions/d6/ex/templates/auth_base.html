<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}{% endblock %}</title>
    <style>
        :root {
            --bg: #f4f6fb;
            --card: #ffffff;
            --ink: #1f2933;
            --muted: #6b7280;
            --accent: #4f46e5;
            --accent-dark: #4338ca;
            --border: #e5e7eb;
            --error: #b91c1c;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
            color: var(--ink);
            background:
                    radial-gradient(900px 500px at 80% -10%, #e0e7ff 0%, transparent 60%),
                    var(--bg);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem 1rem;
        }

        .card {
            width: 100%;
            max-width: 420px;
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
            padding: 2.25rem;
            position: relative;
        }

        .brand {
            font-weight: 700;
            font-size: 1.1rem;
            text-align: center;
            margin-bottom: 0.25rem;
        }
        .brand span { color: var(--accent); }

        h1 {
            font-size: 1.5rem;
            text-align: center;
            margin: 0.5rem 0 0.25rem;
        }

        .subtitle {
            text-align: center;
            color: var(--muted);
            font-size: 0.9rem;
            margin: 0 0 1.75rem;
        }

        form { display: flex; flex-direction: column; gap: 1rem; }

        .field { display: flex; flex-direction: column; gap: 0.35rem; }

        .field label { font-weight: 600; font-size: 0.85rem; }

        .field input {
            padding: 0.6rem 0.75rem;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 1rem;
        }
        .field input:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 3px #e0e7ff;
        }

        .errorlist {
            margin: 0;
            padding: 0;
            list-style: none;
            color: var(--error);
            font-size: 0.8rem;
        }

        .btn {
            margin-top: 0.5rem;
            padding: 0.75rem;
            border: none;
            border-radius: 8px;
            background: var(--accent);
            color: #fff;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
        }
        .btn:hover { background: var(--accent-dark); }

        .switch {
            text-align: center;
            margin-top: 1.5rem;
            font-size: 0.9rem;
            color: var(--muted);
        }
        .switch a { color: var(--accent); text-decoration: none; font-weight: 600; }
        .switch a:hover { text-decoration: underline; }

        .nonfield {
            background: #fef2f2;
            border: 1px solid #fecaca;
            color: var(--error);
            border-radius: 8px;
            padding: 0.6rem 0.8rem;
            font-size: 0.85rem;
        }
        .close {
            position: absolute;
            top: 1rem;
            right: 1rem;
            width: 2rem;
            height: 2rem;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            background: #f3f4f6;
            color: #6b7280;
            font-size: 1.4rem;
            line-height: 1;
            text-decoration: none;
            transition: background 0.15s, color 0.15s;
        }
        .close:hover { background: #fee2e2; color: var(--error); }
    </style>
</head>
<body>
<div class="card">
    <a href="/" class="close" aria-label="Close">&times;</a>
    {% block head %}{% endblock %}

    <div class="field">
        {% block form %}{% endblock %}
    </div>

    {% block switch %}{% endblock %}
</div>
</body>
</html>
