<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log out — Life Pro Tips</title>
    <style>
        :root {
            --bg: #f4f6fb;
            --card: #ffffff;
            --ink: #1f2933;
            --muted: #6b7280;
            --accent: #4f46e5;
            --accent-dark: #4338ca;
            --border: #e5e7eb;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
            color: var(--ink);
            background:
                    radial-gradient(900px 500px at 80% -10%, #e0e7ff 0%, transparent 60%),
                    var(--bg);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem 1rem;
        }

        .card {
            width: 100%;
            max-width: 420px;
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
            padding: 2.5rem 2.25rem;
            text-align: center;
        }

        .brand {
            font-weight: 700;
            font-size: 1.1rem;
            margin-bottom: 1rem;
        }
        .brand span { color: var(--accent); }

        .icon {
            font-size: 2.5rem;
            margin-bottom: 0.75rem;
        }

        h1 {
            font-size: 1.5rem;
            margin: 0 0 0.5rem;
        }

        .subtitle {
            color: var(--muted);
            font-size: 0.95rem;
            margin: 0 0 1.75rem;
        }
        .subtitle b { color: var(--ink); }

        form { margin: 0; }

        .btn {
            display: block;
            width: 100%;
            padding: 0.75rem;
            border: none;
            border-radius: 8px;
            background: var(--accent);
            color: #fff;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            margin-bottom: 0.75rem;
        }
        .btn:hover { background: var(--accent-dark); }

        .btn-ghost {
            display: block;
            width: 100%;
            padding: 0.75rem;
            border-radius: 8px;
            background: var(--card);
            color: var(--ink);
            border: 1px solid var(--border);
            font-size: 1rem;
            font-weight: 600;
            text-decoration: none;
        }
        .btn-ghost:hover { border-color: var(--accent); color: var(--accent); }
    </style>
</head>
<body>
<div class="card">
    <div class="brand">Life <span>Pro Tips</span></div>
    <div class="icon">👋</div>
    <h1>Log out</h1>

    <p class="subtitle">
        You are logged in as <b>{{ request.user.username }}</b>.<br>
        Are you sure you want to log out?
    </p>
    <form method="post" action="{% url 'logout' %}">
        {% csrf_token %}
        <button type="submit" name="logout" value="logout" class="btn">Log out</button>
    </form>
    <a class="btn-ghost" href="/">Stay logged in</a>
</div>
</body>
</html>
