<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Search</title>
    <style>
        body {
            min-height: 100vh;
            margin: 0;
            padding: 2rem;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2rem;
            font-family: system-ui, sans-serif;
            background: #f4f5f7;
            color: #222;
        }

        /* ---------- Formulaire ---------- */
        form {
            width: 100%;
            max-width: 520px;
            background: #fff;
            padding: 1.5rem;
            border-radius: 8px;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.08);
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .field {
            display: flex;
            flex-direction: column;
            gap: 0.35rem;
        }

        .field label {
            font-weight: 600;
            font-size: 0.9rem;
        }

        .field input,
        .field select {
            padding: 0.5rem 0.65rem;
            border: 1px solid #d1d5db;
            border-radius: 6px;
            font-size: 1rem;
        }

        .errorlist {
            margin: 0;
            padding: 0;
            list-style: none;
            color: #b91c1c;
            font-size: 0.85rem;
        }

        button {
            padding: 0.65rem;
            border: none;
            border-radius: 6px;
            background: #1f2937;
            color: #fff;
            font-size: 1rem;
            cursor: pointer;
        }

        button:hover {
            background: #374151;
        }

        /* ---------- Tableau ---------- */
        table {
            border-collapse: collapse;
            width: 100%;
            max-width: 1100px;
            background: #fff;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.08);
        }

        th, td {
            padding: 0.75rem 1rem;
            text-align: left;
            border-bottom: 1px solid #e5e7eb;
        }

        th {
            background: #1f2937;
            color: #fff;
            font-weight: 600;
            text-transform: uppercase;
            font-size: 0.8rem;
            letter-spacing: 0.05em;
        }

        tr:nth-child(even) td {
            background: #f9fafb;
        }

        tr:hover td {
            background: #eef2ff;
        }

        .empty {
            color: #6b7280;
            font-style: italic;
        }
    </style>
</head>
<body>

<form method="post">
    {% csrf_token %}
    {{ form }}
    <button type="submit">Search</button>
</form>

{% if rows %}
<table>
    <tr>
        {% for head in header %}
        <th>{{head}}</th>
        {% endfor %}
    </tr>
    {% for row in rows %}
    <tr>
        {% for data in row %}
        <td>{{ data|default_if_none:"" }}</td>
        {% endfor %}
    </tr>
    {% endfor %}
</table>
{% else %}
<p class="empty">Nothing corresponding to your research</p>
{% endif %}

</body>
</html>
