<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Chatrooms</title>
    <style>
        :root {
            --bg: #f4f1ec;
            --card: #ffffff;
            --text: #1f1d1a;
            --muted: #6b665e;
            --border: #ddd6cb;
            --accent: #d9572b;
            --accent-hover: #bf4720;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #161513;
                --card: #22201d;
                --text: #f1ede6;
                --muted: #a39d93;
                --border: #3a3631;
                --accent: #ef7148;
                --accent-hover: #f58a66;
            }
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            background: var(--bg);
            color: var(--text);
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        }

        .card {
            width: 100%;
            max-width: 380px;
            padding: 36px 32px;
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 14px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
        }

        h1 {
            margin: 0 0 6px;
            font-size: 1.5rem;
        }

        .subtitle {
            margin: 0 0 24px;
            color: var(--muted);
        }

        .rooms {
            margin: 0;
            padding: 0;
            list-style: none;
        }

        .rooms li + li { margin-top: 10px; }

        .rooms a {
            display: block;
            padding: 14px 16px;
            font-weight: 600;
            color: var(--text);
            text-decoration: none;
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 10px;
            transition: border-color 0.15s, color 0.15s;
        }

        .rooms a::before {
            content: "# ";
            color: var(--accent);
        }

        .rooms a:hover {
            border-color: var(--accent);
            color: var(--accent);
        }

        .empty {
            color: var(--muted);
            font-style: italic;
        }
    </style>
</head>
<body>
<main class="card">
    <h1>Chatrooms</h1>
    <p class="subtitle">Pick a room to join the conversation.</p>

    <ul class="rooms">
        {% for room in rooms %}
        <li><a href="{% url 'chatroom' room.name %}">{{ room.name }}</a></li>
        {% empty %}
        <li class="empty">No chatroom yet.</li>
        {% endfor %}
    </ul>
</main>
</body>
</html>
