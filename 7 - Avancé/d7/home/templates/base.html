<!DOCTYPE html>
{% load i18n %}
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}{% translate "The Journal" %}{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        header {
            display: flex;
            flex-direction: column;
            gap: 0.6rem;
            padding-top: 1rem;
            padding-bottom: 1rem;
        }

        .lang-switch {
            display: flex;
            align-self: flex-start;
            gap: 0.5rem;
            margin: 0;
        }
        .lang-btn {
            display: flex;
            padding: 3px;
            border: 2px solid transparent;
            border-radius: 6px;
            background: none;
            opacity: 0.5;
            cursor: pointer;
            transition: opacity 0.15s, border-color 0.15s;
        }
        .lang-btn:hover {
            opacity: 1;
        }
        .lang-btn.is-active {
            opacity: 1;
            border-color: var(--or);
        }
        .lang-btn svg {
            display: block;
            border-radius: 2px;
        }
        :root {
            --encre: #1b2a41;
            --papier: #eef2f5;
            --surface: #ffffff;
            --trait: #d5dde5;
            --doux: #5b6b80;
            --or: #e8b021;
            --or-fonce: #c48f0a;
        }
        @media (prefers-color-scheme: dark) {
            :root {
                --encre: #e6ecf3;
                --papier: #121a26;
                --surface: #1a2433;
                --trait: #2c3a4e;
                --doux: #94a3b8;
                color-scheme: dark;
            }
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            font-family: "Bricolage Grotesque", system-ui, sans-serif;
            background: var(--papier);
            color: var(--encre);
            line-height: 1.5;
        }

        header, main {
            max-width: 1100px;
            margin: 0 auto;
            padding-left: 1.5rem;
            padding-right: 1.5rem;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-top: 1.5rem;
            padding-bottom: 1rem;
        }

        main {
            padding-bottom: 3rem;
        }

        .logo {
            font-weight: 800;
            font-size: 1.2rem;
            letter-spacing: -0.02em;
            color: var(--encre);
            text-decoration: none;
        }
        .navbar .nav-link.active {
            background: #000;
            border-radius: 6px;
        }

        a:focus-visible, summary:focus-visible, button:focus-visible, input:focus-visible {
            outline: 3px solid var(--encre);
            outline-offset: 3px;
        }

        @media (prefers-reduced-motion: reduce) {
            * { transition: none !important; }
        }

        {% block style %}{% endblock %}
    </style>
</head>
<body>
<header>
    {% get_current_language as LANG %}
    <form action="{% url 'set_language' %}" method="post" class="lang-switch">
        {% csrf_token %}
        <input type="hidden" name="next" value="{{ request.path }}">

        <button type="submit" name="language" value="en"
                class="lang-btn {% if LANG == 'en' %}is-active{% endif %}"
                title="English" aria-label="English" {% if LANG == 'en' %}aria-current="true"{% endif %}>
        <svg viewBox="0 0 60 30" width="30" height="15" aria-hidden="true">
            <clipPath id="uk-s"><path d="M0,0 v30 h60 v-30 z"/></clipPath>
            <clipPath id="uk-t"><path d="M30,15 h30 v15 z v15 h-30 z h-30 v-15 z v-15 h30 z"/></clipPath>
            <g clip-path="url(#uk-s)">
                <path d="M0,0 v30 h60 v-30 z" fill="#012169"/>
                <path d="M0,0 L60,30 M60,0 L0,30" stroke="#fff" stroke-width="6"/>
                <path d="M0,0 L60,30 M60,0 L0,30" clip-path="url(#uk-t)" stroke="#C8102E" stroke-width="4"/>
                <path d="M30,0 v30 M0,15 h60" stroke="#fff" stroke-width="10"/>
                <path d="M30,0 v30 M0,15 h60" stroke="#C8102E" stroke-width="6"/>
            </g>
        </svg>
        </button>

        <button type="submit" name="language" value="fr"
                class="lang-btn {% if LANG == 'fr' %}is-active{% endif %}"
                title="Français" aria-label="Français" {% if LANG == 'fr' %}aria-current="true"{% endif %}>
        <svg viewBox="0 0 3 2" width="30" height="20" aria-hidden="true">
            <rect width="1" height="2" x="0" fill="#002395"/>
            <rect width="1" height="2" x="1" fill="#fff"/>
            <rect width="1" height="2" x="2" fill="#ED2939"/>
        </svg>
        </button>
    </form>

    {% include "navbar.html" %}
</header>

<main>
    {% block content %}{% endblock %}
</main>

<script>
    const compte = document.querySelector(".compte");
    document.addEventListener("click", (e) => {
        if (compte.open && !compte.contains(e.target)) compte.open = false;
    });
    document.addEventListener("keydown", (e) => {
        if (e.key === "Escape" && compte.open) {
            compte.open = false;
            compte.querySelector("summary").focus();
        }
    });
</script>
</body>
</html>
